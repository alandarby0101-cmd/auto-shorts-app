<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Shorts – Pro</title>
  <link rel="stylesheet" href="pro.css" />
</head>
<body>

<div id="pro-page">

  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div id="profileCard">
      <img src="logo.png" class="avatar" />
      <h2>Alex Summers</h2>
      <p class="active">✔ Pro Active</p>
      <p>Videos: 0</p>
      <p>Virality: --</p>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- TOP BAR -->
    <div id="topBar">
      <h1>Describe your short</h1>
      <div class="topInputRow">
        <input id="promptInput" placeholder="Topic, style, vibe, description..." />
        <button id="generateBtn">Generate</button>
      </div>
    </div>

    <!-- MIDDLE ROW -->
    <div id="middle-row">

      <!-- SCRIPT CARD -->
      <div class="card" id="scriptCard">
        <h3>Script / Hooks / Captions</h3>
        <div class="tabs">
          <button id="tabScript">Script</button>
          <button id="tabHook">Hook</button>
          <button id="tabCaptions">Captions</button>
        </div>
        <div id="outputBox">Waiting for input...</div>
        <button id="copyBtn">Copy</button>
      </div>

      <!-- VOICE CARD -->
      <div class="card" id="musicCard">
        <h3>Voice & Music</h3>
        <div id="musicBox">Voice: Ryan (US Male)</div>
        <div id="musicBox">Track: Synthwave Dreams</div>
        <button id="changeMusicBtn">Change Voice / Music</button>
      </div>

      <!-- PREVIEW CARD -->
      <div class="card" id="previewCard">
        <h3>Video Preview</h3>
        <div id="previewBox">
          <video id="previewVideo" controls></video>
        </div>
        <button id="previewBtn">Preview Video</button>
      </div>

    </div>

    <!-- FINAL BUTTON -->
    <div id="finalRow">
      <button id="finalGenerateBtn">Generate Final Short</button>
    </div>

  </div>

</div>

<script src="pro.js"></script>
</body>
</html>
