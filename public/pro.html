<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auto Shorts AI – Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ===============================
   GLOBAL
================================ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, system-ui, sans-serif;
}

body {
  min-height: 100vh;
  background: url("/galaxy-bg.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  overflow-x: hidden;
}

.container {
  display: grid;
  grid-template-columns: 260px 1fr 360px;
  gap: 24px;
  padding: 30px;
}

/* ===============================
   PREMIUM GLASS SECTIONS
================================ */
.section,
.profile,
.combine {
  background: rgba(15, 20, 45, 0.65);
  backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 20px;
  border: 1px solid rgba(140,160,255,0.25);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.05),
    0 0 40px rgba(80,100,255,0.25);
}

/* ===============================
   PROFILE
================================ */
.profile img {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  margin-bottom: 12px;
}
.profile h3 {
  font-size: 18px;
}
.profile .status {
  color: #3bffb2;
  font-size: 14px;
  margin-top: 6px;
}

/* ===============================
   HEADINGS
================================ */
.section h2 {
  font-size: 17px;
  margin-bottom: 10px;
  color: #b8c7ff;
  letter-spacing: 0.5px;
}

/* ===============================
   TABS (SCRIPT / HOOK / CAPTIONS)
================================ */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.tab {
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  cursor: pointer;
  font-size: 13px;
  transition: 0.2s;
}
.tab.active {
  background: linear-gradient(135deg, #5a7cff, #8fa4ff);
  box-shadow: 0 0 12px rgba(120,150,255,0.7);
}

/* ===============================
   INPUTS
================================ */
textarea,
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(140,160,255,0.25);
  background: rgba(0,0,0,0.4);
  color: #fff;
  outline: none;
  margin-bottom: 10px;
}

/* ===============================
   OUTPUT BOX (SCROLLABLE)
================================ */
.output {
  background: rgba(0,0,0,0.35);
  border-radius: 12px;
  padding: 14px;
  min-height: 140px;
  max-height: 240px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.5;
  border: 1px solid rgba(140,160,255,0.25);
}

/* ===============================
   BUTTONS (PREMIUM)
================================ */
.btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(135deg, #5a7cff, #8fa4ff);
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 0.4px;
  box-shadow:
    0 6px 16px rgba(90,120,255,0.45),
    inset 0 0 0 1px rgba(255,255,255,0.15);
  transition: 0.25s;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(90,120,255,0.7);
}
.btn:active {
  transform: scale(0.98);
}

/* ===============================
   VIDEO
================================ */
.video-box {
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(140,160,255,0.25);
  margin-bottom: 10px;
  color: #9fb0ff;
}

/* ===============================
   FINAL COMBINE
================================ */
.combine {
  grid-column: span 3;
  text-align: center;
  padding: 28px;
  margin-top: 20px;
  border: 1px solid rgba(140,160,255,0.35);
}
.combine h1 {
  font-size: 26px;
  margin-bottom: 10px;
}
.combine p {
  color: #cdd6ff;
  margin-bottom: 18px;
}
</style>
</head>

<body>

<div class="container">

  <!-- PROFILE -->
  <div class="profile">
    <img src="/logo.png" />
    <h3 id="username">Pro User</h3>
    <div class="status">✔ Pro Active</div>
    <div style="margin-top:14px;font-size:13px;color:#aaa;">Videos: <span id="videoCount">0</span></div>
  </div>

  <!-- MAIN -->
  <div>

    <!-- SCRIPT / HOOK / CAPTIONS -->
    <div class="section">
      <h2>Scripts / Hooks / Captions</h2>

      <div class="tabs">
        <div class="tab active" data-type="script">Script</div>
        <div class="tab" data-type="hook">Hook</div>
        <div class="tab" data-type="caption">Caption</div>
      </div>

      <textarea id="promptInput" placeholder="Describe your video..."></textarea>
      <div class="output" id="outputBox">Generated text will appear here…</div>

      <button class="btn" id="generateBtn">Generate</button>
      <button class="btn" id="copyBtn">Copy</button>
    </div>

    <!-- MUSIC -->
    <div class="section">
      <h2>Music</h2>
      <div class="output" id="musicBox">Music will be selected automatically</div>
    </div>

  </div>

  <!-- VIDEO -->
  <div class="section">
    <h2>Video</h2>
    <div class="video-box" id="videoPreview">Preview will appear here</div>
    <button class="btn" id="previewBtn">Preview Video</button>
  </div>

  <!-- FINAL -->
  <div class="combine">
    <h1>Create Final Short</h1>
    <p>Everything is combined into your final video</p>
    <button class="btn" id="finalBtn">Generate Final Short</button>
  </div>

</div>

<script>
let currentTab = "script";

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentTab = tab.dataset.type;
  };
});

document.getElementById("generateBtn").onclick = async () => {
  const prompt = document.getElementById("promptInput").value;
  const res = await fetch("/api/generate-script", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ prompt })
  });
  const data = await res.json();
  document.getElementById("outputBox").innerText = data.script;
  document.getElementById("musicBox").innerText = data.music;
};

document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(document.getElementById("outputBox").innerText);
};

document.getElementById("previewBtn").onclick = async () => {
  window.open("/sample.html", "_blank");
};

document.getElementById("finalBtn").onclick = async () => {
  const res = await fetch("/api/generate-video", { method: "POST" });
  const data = await res.json();
  window.location.href = data.url;
};
</script>

</body>
</html>
