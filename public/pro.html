<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auto Shorts AI – Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, system-ui, sans-serif;
}

body {
  min-height: 100vh;
  background: url("/galaxy-bg.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

.container {
  display: grid;
  grid-template-columns: 260px 1fr 360px;
  gap: 24px;
  padding: 30px;
}

.section, .profile, .combine {
  background: rgba(15,20,45,0.65);
  backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 20px;
  border: 1px solid rgba(140,160,255,0.3);
  box-shadow: 0 0 30px rgba(90,120,255,0.25);
}

.section h2 { color:#b8c7ff; margin-bottom:10px; }

.tabs { display:flex; gap:8px; margin-bottom:10px; }
.tab {
  padding:6px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  cursor:pointer;
  font-size:13px;
}
.tab.active { background:#5a7cff; }

textarea {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(140,160,255,0.3);
  background:rgba(0,0,0,0.4);
  color:#fff;
  margin-bottom:10px;
}

.output {
  background:rgba(0,0,0,0.35);
  border-radius:12px;
  padding:14px;
  min-height:140px;
  max-height:240px;
  overflow-y:auto;
  border:1px solid rgba(140,160,255,0.25);
}

.btn {
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,#5a7cff,#8fa4ff);
  border:none;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.video-box {
  height:260px;
  border-radius:16px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(140,160,255,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9fb0ff;
}

.combine {
  grid-column:span 3;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- PROFILE -->
  <div class="profile">
    <img src="/logo.png" width="72" />
    <h3 id="username">Pro User</h3>
    <div>Videos: <span id="videoCount">0</span></div>
  </div>

  <!-- MAIN -->
  <div>
    <div class="section">
      <h2>Scripts / Hooks / Captions</h2>

      <div class="tabs">
      <div id="scriptTab" class="tab active" data-type="script">Script</div>
      <div id="hookTab" class="tab" data-type="hook">Hook</div>
      <div id="captionTab" class="tab" data-type="caption">Caption</div>
      </div>

      <textarea id="promptInput" placeholder="Describe your video..."></textarea>
      <div class="output" id="outputBox"></div>

      <button class="btn" id="generateBtn">Generate</button>
      <button class="btn" id="copyBtn">Copy</button>
    </div>

    <div class="section">
      <h2>Music</h2>
      <div class="output" id="musicBox">Auto-selected based on script</div>
    </div>
  </div>

  <!-- VIDEO -->
  <div class="section">
    <h2>Video</h2>
    <div class="video-box" id="videoPreview">Preview appears here</div>
    <button class="btn" id="previewBtn">Preview Video</button>
  </div>

  <!-- FINAL -->
  <div class="combine">
    <h1>Create Final Short</h1>
    <button class="btn" id="finalBtn">Generate Final Short</button>
  </div>

</div>

<script src="./pro.js"></script>
</body>
</html>
