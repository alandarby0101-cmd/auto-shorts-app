<body>
  <div class="app">

    <!-- PROFILE SECTION -->
    <aside class="profile-card">
      <div class="profile-top">
        <button id="settingsBtn" class="settings-btn">⚙</button>
        <div class="avatar"></div>
        <h3 id="username">Pro User</h3>
        <span class="status">Pro Active</span>
        <p id="videoCount">0 videos</p>
      </div>

      <div class="profile-logo">
        <img src="/logo.png" alt="Auto Shorts AI" />
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- PROMPT BAR -->
      <div class="prompt-bar">
        <input id="promptInput" placeholder="Describe your short..." />
        <button id="generateBtn">Generate</button>
      </div>

      <!-- CARDS ROW -->
      <div class="cards">

        <!-- SCRIPT / HOOK / CAPTIONS -->
        <div class="card">
          <div class="tabs">
            <button class="tab active" data-tab="script">S</button>
            <button class="tab" data-tab="hook">H</button>
            <button class="tab" data-tab="captions">C</button>
          </div>

          <div id="textBox" class="scroll-box">
            Waiting for script...
          </div>

          <button id="copyBtn" class="copy-btn">Copy</button>
        </div>

        <!-- MUSIC -->
        <div class="card">
          <h3>Music</h3>
          <div id="musicBox" class="scroll-box">
            Waiting for music...
          </div>
        </div>

        <!-- VIDEO PREVIEW -->
        <div class="card">
          <h3>Video</h3>
          <div id="videoBox" class="video-box">
            Preview ready
          </div>
          <button id="previewBtn">Preview</button>
        </div>

      </div>

      <!-- FINAL BUTTON -->
      <button id="finalBtn" class="final-btn">
        Generate Final Short
      </button>

    </main>
  </div>

  <script src="/pro.js"></script>
</body>
