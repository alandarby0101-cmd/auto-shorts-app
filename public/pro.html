<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auto Shorts AI – Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="./pro.css">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, system-ui, sans-serif;
}

body {
  min-height: 100vh;
  background: url("/galaxy-bg.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

.container {
  display: grid;
  align-items: start;
  grid-template-columns: 220px 1fr 300xp;
  gap: 24px;
  padding: 30px;
}

.section, .profile, .combine {
  background: rgba(15,20,45,0.65);
  backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 20px;
  border: 1px solid rgba(140,160,255,0.3);
  box-shadow: 0 0 30px rgba(90,120,255,0.25);
}

.section h2 { color:#b8c7ff; margin-bottom:10px; }

.tabs { display:flex; gap:8px; margin-bottom:10px; }
.tab {
  padding:6px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  cursor:pointer;
  font-size:13px;
}
.tab.active { background:#5a7cff; }

textarea {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(140,160,255,0.3);
  background:rgba(0,0,0,0.4);
  color:#fff;
  margin-bottom:10px;
}

.output {
  background:rgba(0,0,0,0.35);
  border-radius:12px;
  padding:14px;
  min-height:140px;
  max-height:240px;
  overflow-y:auto;
  border:1px solid rgba(140,160,255,0.25);
}

.btn {
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,#5a7cff,#8fa4ff);
  border:none;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.video-box {
  height:260px;
  border-radius:16px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(140,160,255,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9fb0ff;
}

.combine {
  grid-column:span 3;
  text-align:center;
  margin-top:20px;
}
  
/* ===========================
   PRO USER CARD REDESIGN
=========================== */

.pro-user-card {
    background: rgba(20, 30, 60, 0.85);
    border: 1px solid rgba(100, 150, 255, 0.3);
    border-radius: 20px;
    padding: 30px;
    width: 320px;
    height: fit-content;
align-self: start;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(80, 140, 255, 0.25);
}

.pro-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
/* ===========================
   EDIT PROFILE MODAL
=========================== */

#editModal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(5,10,25,0.75);
    backdrop-filter:blur(18px);
    z-index:9999;
    animation:fadeIn 0.25s ease;
}

.edit-card{
    width:360px;
    padding:28px;
    border-radius:22px;
    background:rgba(18,28,60,0.92);
    border:1px solid rgba(120,160,255,0.35);
    box-shadow:0 0 60px rgba(80,140,255,0.25);
    backdrop-filter:blur(20px);
    animation:popUp .25s ease;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes popUp{
    from{transform:scale(.92);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

.edit-card{
  background:rgba(20,30,60,0.95);
  padding:25px;
  border-radius:18px;
  width:320px;
  backdrop-filter:blur(12px);
  border:1px solid rgba(120,160,255,0.4);
}
.edit-card h3{
    margin-bottom:18px;
    font-size:20px;
}

.edit-card input{
    width:100%;
    margin:10px 0;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(120,160,255,0.25);
    background:rgba(10,18,40,0.7);
    color:white;
    outline:none;
}

.edit-card input::placeholder{
    color:rgba(200,220,255,0.6);
}

.edit-card button{
    margin-top:12px;
    padding:10px 16px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    font-weight:600;
    background:linear-gradient(90deg,#5da9ff,#8ec5ff);
    color:white;
}

.edit-card button:last-child{
    background:rgba(255,255,255,0.1);
}
.modal-box input{
  width:100%;
  margin:10px 0;
  padding:10px;
  border-radius:10px;
  border:none;
}
.pro-icon {
    font-size: 28px;
}

.pro-stats {
    margin-bottom: 25px;
}

.stat {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    opacity: 0.9;
}

.stat-label {
    color: #9fb0ff;
}

.stat-value {
    font-weight: bold;
    font-size: 18px;
}

.edit-profile-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #4f8cff, #9f6bff);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

.edit-profile-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(120, 160, 255, 0.6);
}
/* =========================
   PROFILE EDIT MODAL FIX
========================= */

.profile-modal{
  position: fixed;
  top: 0;
  left: 0;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  z-index:999;
}

.profile-modal-content{
  background: rgba(20,30,60,0.95);
  border:1px solid rgba(120,160,255,0.4);
  border-radius:18px;
  padding:25px;
  width:320px;
  box-shadow:0 0 40px rgba(80,140,255,0.35);
}
</style>
</head>

<body>

<div class="container">

  <!-- PROFILE -->
<div class="pro-user-card">

  <div class="pro-header">
    <span class="pro-icon">🚀</span>
    <h3 id="username">Pro User</h3>
  </div>

  <div class="pro-stats">
    <div class="stat">
      <span class="stat-label">Videos</span>
      <span class="stat-value" id="videoCount">0</span>
    </div>
  </div>
<button class="edit-profile-btn" onclick="openEdit()">
</button>

</div>
  <!-- MAIN -->
  <div>
    <div class="section">
      <h2>Scripts / Hooks / Captions</h2>

      <div class="tabs">
      <div id="scriptTab" class="tab active" data-type="script">Script</div>
      <div id="hookTab" class="tab" data-type="hook">Hook</div>
      <div id="captionTab" class="tab" data-type="caption">Caption</div>
      </div>

      <textarea id="promptInput" placeholder="Describe your video..."></textarea>
      <div class="output" id="outputBox"></div>

      <button class="btn" id="generateBtn">Generate</button>
      <button class="btn" id="copyBtn">Copy</button>
    </div>

    <div class="section">
      <h2>Music</h2>
      <div class="output" id="musicBox">Auto-selected based on script</div>
    </div>
  </div>

  <!-- VIDEO -->
  <div class="section">
    <h2>Video</h2>
    <div class="video-box" id="videoPreview">Preview appears here</div>
    <button class="btn" id="previewBtn">Preview Video</button>
  </div>

  <!-- FINAL -->
  <div class="combine">
    <h1>Create Final Short</h1>
    <button class="btn" id="finalBtn">Generate Final Short</button>
  </div>


<!-- EDIT PROFILE MODAL -->
<div id="editModal" class="profile-modal" style="display:none;">
  <div class="profile-modal-box">

    <h3>Edit Profile</h3>

    <input id="nameInput" placeholder="Enter profile name" />


<button id="saveProfileBtn" onclick="saveProfile()">Save</button>
   <button id="closeProfileBtn" onclick="closeEdit()">Cancel</button>

  </div>

</div>

<script src="./pro.js"></script>
<script>
function openEdit(){
  document.getElementById("editModal").style.display = "flex";
}

function closeEdit(){
  document.getElementById("editModal").style.display = "none";
}


function saveProfile(){

    const newName = document.getElementById("nameInput").value.trim();

    if(!newName){
        alert("Please enter a name.");
        return;
    }

    // SAVE to localStorage
    localStorage.setItem("profileName", newName);

    // Update UI immediately
    document.getElementById("username").textContent = newName;

    closeEdit();
}
</script>
</body>
</html>
