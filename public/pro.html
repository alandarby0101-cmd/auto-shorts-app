<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Auto Shorts AI – Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, system-ui, sans-serif;
}

body {
  min-height: 100vh;
  background: url("/galaxy-bg.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #fff;
}

.container {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
  padding: 30px;
}

.section, .profile, .combine {
  background: rgba(15,20,45,0.65);
  backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 20px;
  border: 1px solid rgba(140,160,255,0.3);
  box-shadow: 0 0 30px rgba(90,120,255,0.25);
}

.section h2 { color:#b8c7ff; margin-bottom:10px; }

.tabs { display:flex; gap:8px; margin-bottom:10px; }
.tab {
  padding:6px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  cursor:pointer;
  font-size:13px;
}
.tab.active { background:#5a7cff; }

textarea {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(140,160,255,0.3);
  background:rgba(0,0,0,0.4);
  color:#fff;
  margin-bottom:10px;
}

.output {
  background:rgba(0,0,0,0.35);
  border-radius:12px;
  padding:14px;
  min-height:140px;
  max-height:240px;
  overflow-y:auto;
  border:1px solid rgba(140,160,255,0.25);
}

.btn {
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,#5a7cff,#8fa4ff);
  border:none;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.video-box {
  height:260px;
  border-radius:16px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(140,160,255,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9fb0ff;
}

.combine {
  grid-column:span 3;
  text-align:center;
  margin-top:20px;
}
  
/* ===========================
   PRO USER CARD REDESIGN
=========================== */

.pro-user-card {
    background: rgba(20, 30, 60, 0.85);
    border: 1px solid rgba(100, 150, 255, 0.3);
    border-radius: 20px;
    padding: 30px;
    width: 320px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(80, 140, 255, 0.25);
}

.pro-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.pro-icon {
    font-size: 28px;
}

.pro-stats {
    margin-bottom: 25px;
}

.stat {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    opacity: 0.9;
}

.stat-label {
    color: #9fb0ff;
}

.stat-value {
    font-weight: bold;
    font-size: 18px;
}

.edit-profile-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #4f8cff, #9f6bff);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

.edit-profile-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(120, 160, 255, 0.6);
}

</style>
</head>

<body>

<div class="container">

  <!-- PROFILE -->
<div class="pro-user-card">

  <div class="pro-header">
    <span class="pro-icon">🚀</span>
    <h3 id="username">Pro User</h3>
  </div>

  <div class="pro-stats">
    <div class="stat">
      <span class="stat-label">Videos</span>
      <span class="stat-value" id="videoCount">0</span>
    </div>
  </div>

  <button class="edit-profile-btn">
    Edit Profile
  </button>

</div>

  <!-- MAIN -->
  <div>
    <div class="section">
      <h2>Scripts / Hooks / Captions</h2>

      <div class="tabs">
      <div id="scriptTab" class="tab active" data-type="script">Script</div>
      <div id="hookTab" class="tab" data-type="hook">Hook</div>
      <div id="captionTab" class="tab" data-type="caption">Caption</div>
      </div>

      <textarea id="promptInput" placeholder="Describe your video..."></textarea>
      <div class="output" id="outputBox"></div>

      <button class="btn" id="generateBtn">Generate</button>
      <button class="btn" id="copyBtn">Copy</button>
    </div>

    <div class="section">
      <h2>Music</h2>
      <div class="output" id="musicBox">Auto-selected based on script</div>
    </div>
  </div>

  <!-- VIDEO -->
  <div class="section">
    <h2>Video</h2>
    <div class="video-box" id="videoPreview">Preview appears here</div>
    <button class="btn" id="previewBtn">Preview Video</button>
  </div>

  <!-- FINAL -->
  <div class="combine">
    <h1>Create Final Short</h1>
    <button class="btn" id="finalBtn">Generate Final Short</button>
  </div>

</div>

<script src="./pro.js"></script>
</body>
</html>
